name: DCO check sign-off

on:
    pull_request:
        types: [opened, synchronize, reopened]

env:
    http_proxy: http://proxy-mu.intel.com:912
    https_proxy: http://proxy-mu.intel.com:912

permissions:
    contents: read
    pull-requests: read

jobs:
    dco:
        name: DCO Sign-off
        runs-on: [self-hosted, gklab, linux, shared]
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  persist-credentials: false
            - name: Check membership and commit sign-offs
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const checkDco = require('./.github/scripts/check-dco.cjs');
                      await checkDco({ github, context, core, exec });
